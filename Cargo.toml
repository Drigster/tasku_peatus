[package]
name = "tasku_peatus"
version = "0.5.0"
edition = "2024"

[features]
devtools = ["freya/devtools"]
hotreload = ["freya/hotreload"]
geoclue = ["zbus"]
scaled = []

[dependencies]
blocking = "1.7.0"
chrono = "0.4.45"
dirs = "7.0.0"
env_logger = "0.11.11"
freya = { git = "https://github.com/marc2332/freya.git", branch = "main", features = [
  "radio",
  "router",
  "icons-lucide",
] }
freya-winit = { git = "https://github.com/marc2332/freya.git", branch = "main" }
futures-channel = "0.3.34"
geo = "0.33.1"
geo-types = "0.7.20"
log = "0.4.35"
ndk-context = "0.1.1"
regex = "1.13.1"
revision = "0.30.0"
serde = { version = "1.0.229", features = ["derive"] }
smol = "2.0.2"
ureq = "3.5.2"
zbus = { version = "6.3.0", optional = true }

[target.'cfg(target_os="android")'.dependencies]
android_logger = "0.15.1"
winit = { version = "0.30.13", features = [
  "android-native-activity",
  "rwh_06",
] }
jni = "0.22.4"

[lib]
path = "src/lib.rs"
name = "tasku_peatus"
crate-type = ["cdylib", "rlib"]

[[bin]]
path = "src/main.rs"
name = "tasku_peatus"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
